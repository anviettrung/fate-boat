<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Con Thuyền Định Mệnh</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2236;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;font-size:13px;line-height:1;padding:3px 7px 4px;border-radius:999px;background:rgba(255,255,255,.86);color:#16314d;box-shadow:0 2px 6px rgba(0,0,0,.25);transform-origin:50% 100%;will-change:transform;transition:background .2s,color .2s,font-size .2s}
.lbl.hot{background:#ffd23f;color:#3a2400;font-size:20px;padding:5px 12px 6px;box-shadow:0 0 0 3px #fff,0 0 22px #ffd23f;z-index:5}
.lbl.wet{background:#0f6fb5;color:#fff;font-size:21px;padding:6px 13px 7px;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.4);z-index:4}
.lbl.safe{background:linear-gradient(#ffe48a,#f5b700);color:#4a2c00}
.lbl.safe::before{content:"👑 "}
.lbl.dim{opacity:.55}
.bubble{position:absolute;left:0;top:0;z-index:7;background:#fff;color:#1b2b3a;font-weight:800;font-size:20px;padding:8px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:14px 12px 0;pointer-events:none;text-align:center}
#title{font-size:clamp(20px,2.6vw,34px);font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 #0b2a45,0 6px 18px rgba(0,0,0,.45)}
#title span{color:#ffd23f}
#status{margin-top:8px;font-size:clamp(15px,1.7vw,24px);font-weight:700;background:rgba(8,26,44,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);max-width:94vw}
#status.twist{background:#e63946;border-color:#fff;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#corner{position:fixed;top:12px;right:12px;z-index:8;display:flex;gap:8px}
#corner button{width:44px;height:44px;border-radius:12px;font-size:20px;padding:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:#fff;background:rgba(10,30,50,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:default;filter:none;transform:none}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#hud{position:fixed;left:0;right:0;bottom:18px;z-index:5;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 12px}
.big{font-size:clamp(17px,1.6vw,23px);font-weight:800;padding:14px 26px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.3)}
.primary{background:linear-gradient(#ffcf3a,#f39c12);color:#3b2200;border-color:#fff5c4}
.danger{background:linear-gradient(#ff6b6b,#d63031);border-color:#ffc9c9}
.sea{background:linear-gradient(#3fc1ff,#1e6fd9);border-color:#c9ecff}
.kbd{font-size:.7em;opacity:.7;margin-left:6px;font-weight:700}
#fallen{position:fixed;left:0;right:0;bottom:96px;z-index:5;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 10px}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);color:#123;padding:8px 10px 8px 8px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .3s ease-out}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px #0f6fb5}
.card .nm{font-weight:800;font-size:clamp(16px,1.5vw,21px);white-space:nowrap}
.card .tag{font-size:12px;font-weight:700;color:#0f6fb5}
.card button{background:#0f6fb5;font-size:15px;font-weight:800;padding:9px 12px;border-radius:12px}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,18,32,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.panel{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(160deg,rgba(20,58,92,.96),rgba(10,32,56,.97));border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:24px 24px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.panel h1{margin:0 0 4px;font-size:30px;font-weight:900}.panel h1 span{color:#ffd23f}
.panel p{margin:0 0 14px;opacity:.85}
textarea{width:100%;height:230px;resize:vertical;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-family:inherit;font-size:15px;line-height:1.45;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.row input[type=number]{width:64px;font:inherit;font-weight:800;padding:6px 8px;border-radius:10px;border:0;text-align:center}
.row input[type=checkbox]{width:20px;height:20px;accent-color:#ffd23f}
.small{font-size:14px;padding:9px 14px;font-weight:700}
#count{margin-left:auto;font-weight:800;color:#ffd23f}
#twist{position:fixed;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none}
#twist .tc{pointer-events:auto;width:min(520px,90vw);text-align:center;background:linear-gradient(#fff8e1,#ffe9a8);color:#3a2400;border-radius:26px;padding:26px 24px 22px;border:5px solid #fff;box-shadow:0 0 0 4px #f39c12,0 30px 70px rgba(0,0,0,.5);animation:flip .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg) scale(.4);opacity:0}}
#twist .em{font-size:84px;line-height:1}
#twist .k{font-size:15px;font-weight:900;letter-spacing:3px;color:#e63946;margin-top:6px}
#twist h2{margin:6px 0 8px;font-size:34px;font-weight:900}
#twist p{margin:0;font-size:19px;font-weight:600}
#final .panel{text-align:center;width:min(760px,100%)}
#final h1{font-size:clamp(26px,3.4vw,42px)}
#winners{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0 20px}
.win{background:#fff;color:#123;border-radius:22px;padding:18px 18px 16px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .4s ease-out both}
.win .av{width:72px;height:72px;font-size:30px;margin:0 auto 10px}
.win .nm{font-size:clamp(20px,2vw,27px);font-weight:900}
.win .no{font-size:13px;font-weight:800;color:#e67e22;letter-spacing:2px}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#dfe9ff;opacity:0}
@media (max-width:640px){#hud{bottom:10px;gap:8px}.big{padding:11px 16px}#fallen{bottom:72px;gap:5px}.card{padding:4px 6px 4px 4px;gap:8px}.card .tag,.kbd{display:none}.card .nm{font-size:15px}.card button{padding:7px 9px;font-size:13px}.big{font-size:15px}.av{width:36px;height:36px;font-size:16px}.lbl{font-size:10px;padding:2px 5px 3px}.lbl.hot,.lbl.wet{font-size:15px}#corner button{width:38px;height:38px;font-size:17px}#top{padding-top:58px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<header id="top"><div id="title">⛵ Con Thuyền <span>Định Mệnh</span></div><div id="status">Ai sẽ rơi xuống biển… và phải lên bảng?</div></header>
<div id="corner">
  <button id="bSound" title="Âm thanh (M)" aria-pressed="false">🔇</button>
  <button id="bFull" title="Toàn màn hình (F)">⛶</button>
  <button id="bSet" title="Danh sách lớp">⚙️</button>
</div>
<div id="fallen"></div>
<div id="hud"></div>

<div id="setup" class="modal">
  <div class="panel">
    <h1>⛵ Con Thuyền <span>Định Mệnh</span></h1>
    <p>Dán danh sách lớp, mỗi dòng một tên. Thuyền ra khơi, bão nổi lên… ai rơi xuống biển sẽ lên kiểm tra bài cũ!</p>
    <textarea id="names" spellcheck="false" placeholder="Nguyễn Văn An&#10;Trần Thị Bình&#10;..."></textarea>
    <div class="row">
      <button id="bSample" class="small">📋 Dùng lớp mẫu (45 bạn)</button>
      <button id="bClearHist" class="small" title="Xoá lịch sử các lần đã bị gọi">🧹 Xoá lịch sử</button>
      <span id="count"></span>
    </div>
    <div class="row">
      <label>Số bạn cần chọn <input id="nPick" type="number" min="1" max="5" value="3"></label>
      <label><input id="oFake" type="checkbox" checked> Plot twist khi đang rơi</label>
      <label><input id="oFair" type="checkbox" checked> Ưu tiên bạn chưa bị gọi</label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      <button id="bStart" class="big primary">🚢 Lên thuyền!</button>
    </div>
  </div>
</div>

<div id="twist" hidden><div class="tc"><div class="em"></div><div class="k">PLOT TWIST</div><h2></h2><p></p></div></div>

<div id="final" class="modal" hidden>
  <div class="panel">
    <h1>🎉 Mời các bạn <span>lên bảng!</span></h1>
    <p>Kiểm tra bài cũ — chúc các bạn may mắn!</p>
    <div id="winners"></div>
    <div class="row" style="justify-content:center">
      <button id="bAgain" class="big primary">🔄 Chơi lại</button>
      <button id="bView" class="big">🌈 Xem biển</button>
      <button id="bList" class="big">📝 Đổi danh sách</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// ============================================================ renderer / scene
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const TOUCH = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, TOUCH ? 1.5 : 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe6f5, 45, 190);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1200);

const hemi = new THREE.HemisphereLight(0xcfe9ff, 0x2a5a6a, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(-9, 16, 11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 9, bottom: -9, near: 1, far: 50 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const SUNDIR = sun.position.clone().normalize();

// ============================================================ weather
const W = { storm: 0, target: 0, flash: 0, rainbow: 0, rainbowT: 0, flow: 0, flowV: 0 };
const PAL = {
  calm: { top: '#2f86d6', hor: '#c4e8f6', fog: '#bfe3f2', hs: '#d6ecff', hg: '#2c5d6b', sunI: 2.6, hemiI: 1.15, deep: '#0a5a8a', shal: '#27b5c9', cl: '#ffffff', cd: '#b8c8da' },
  storm: { top: '#1a2430', hor: '#55636f', fog: '#45525d', hs: '#7d8b98', hg: '#1e2c35', sunI: 0.55, hemiI: 0.75, deep: '#0c2a3a', shal: '#3f6f7c', cl: '#8794a0', cd: '#262f38' },
};
const C = {};
for (const k of Object.keys(PAL.calm)) if (typeof PAL.calm[k] === 'string') C[k] = [new THREE.Color(PAL.calm[k]), new THREE.Color(PAL.storm[k]), new THREE.Color()];
const mixC = (k, s) => C[k][2].copy(C[k][0]).lerp(C[k][1], s);

// ============================================================ waves (shared CPU / GPU)
const WAVES = [
  { d: [1, .25], L: 15, a0: .16, a1: .62, ph: 0 },
  { d: [-.35, 1], L: 9.5, a0: .10, a1: .42, ph: 1.7 },
  { d: [.8, -.6], L: 6, a0: .06, a1: .24, ph: 4.1 },
  { d: [.25, 1], L: 4.2, a0: .035, a1: .12, ph: 2.3 },
  { d: [-.9, -.4], L: 7.5, a0: .05, a1: .26, ph: 5.2 },
].map(w => { const l = Math.hypot(...w.d); const k = TAU / w.L; return { ...w, dx: w.d[0] / l, dz: w.d[1] / l, k, om: Math.sqrt(9.8 * k) * .72 }; });
const AMP = WAVES.map(w => w.a0);
let T = 0;
function waveH(x, z) {
  let h = 0; const xx = x + W.flow;
  for (let i = 0; i < 5; i++) { const w = WAVES[i]; h += AMP[i] * Math.sin(w.k * (w.dx * xx + w.dz * z) - w.om * T + w.ph); }
  return h;
}
const NOISE_GLSL = `
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+17.1;a*=.5;}return v;}`;

const oceanMat = new THREE.ShaderMaterial({
  fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uTime: { value: 0 }, uFlow: { value: 0 },
    uW: { value: WAVES.map(w => new THREE.Vector4(w.dx, w.dz, w.k, w.om)) },
    uA: { value: AMP.slice() }, uPh: { value: WAVES.map(w => w.ph) }, uAmpSum: { value: 1 },
    uDeep: { value: new THREE.Color() }, uShal: { value: new THREE.Color() }, uSky: { value: new THREE.Color() },
    uSunDir: { value: SUNDIR }, uSunCol: { value: new THREE.Color(1, .95, .85) }, uSunI: { value: 1 },
    uFlash: { value: 0 }, uStorm: { value: 0 }, uBoat: { value: new THREE.Vector3() },
  }]),
  vertexShader: `
uniform float uTime,uFlow; uniform vec4 uW[5]; uniform float uA[5]; uniform float uPh[5];
varying vec3 vW; varying float vH;
#include <fog_pars_vertex>
void main(){
  vec4 wp=modelMatrix*vec4(position,1.);
  float h=0.; vec2 p=wp.xz+vec2(uFlow,0.);
  for(int i=0;i<5;i++){ h+=uA[i]*sin(uW[i].z*dot(uW[i].xy,p)-uW[i].w*uTime+uPh[i]); }
  wp.y+=h; vW=wp.xyz; vH=h;
  vec4 mvPosition=viewMatrix*wp; gl_Position=projectionMatrix*mvPosition;
  #include <fog_vertex>
}`,
  fragmentShader: `
uniform vec3 uDeep,uShal,uSky,uSunDir,uSunCol,uBoat; uniform float uSunI,uFlash,uStorm,uAmpSum,uTime,uFlow;
varying vec3 vW; varying float vH;
#include <fog_pars_fragment>
${NOISE_GLSL}
void main(){
  vec3 n=normalize(cross(dFdx(vW),dFdy(vW))); if(n.y<0.) n=-n;
  vec3 V=normalize(cameraPosition-vW);
  float hn=vH/uAmpSum;
  vec3 col=mix(uDeep,uShal,smoothstep(-.35,.6,hn));
  float dif=max(dot(n,uSunDir),0.);
  col*=.62+.55*dif;
  float fr=pow(1.-max(dot(n,V),0.),4.);
  col=mix(col,uSky,fr*.55);
  vec3 R=reflect(-V,n);
  col+=uSunCol*pow(max(dot(R,uSunDir),0.),90.)*uSunI*.9;
  vec2 q=vW.xz+vec2(uFlow,0.);
  float nz=noise(q*1.3+uTime*.3)*.6+noise(q*3.1-uTime*.5)*.4;
  float foam=smoothstep(.42,.62,hn+(nz-.5)*.25)*.85;
  // foam collar around the hull
  vec2 b=vW.xz-uBoat.xy; float cs=cos(uBoat.z),sn=sin(uBoat.z); b=vec2(cs*b.x+sn*b.y,-sn*b.x+cs*b.y);
  float e=length((b-vec2(.3,0.))/vec2(7.4,2.95));
  if(e<.97) discard;
  foam=max(foam,smoothstep(.12,0.,abs(e-1.03)-nz*.06)*(.5+.4*nz));
  col=mix(col,vec3(.93,.97,1.)*(.75+.35*dif),foam*.85);
  col+=uFlash*vec3(.25,.28,.35);
  gl_FragColor=vec4(col,1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  #include <fog_fragment>
}`,
});
const oceanGeo = new THREE.PlaneGeometry(260, 260, 230, 230); oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, oceanMat); ocean.position.z = -40; ocean.frustumCulled = false;
scene.add(ocean);

// ============================================================ sky
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uCl: { value: new THREE.Color() }, uCd: { value: new THREE.Color() },
    uTime: { value: 0 }, uCover: { value: .3 }, uStorm: { value: 0 }, uFlash: { value: 0 }, uRainbow: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z=gl_Position.w; }`,
  fragmentShader: `
uniform vec3 uTop,uHor,uCl,uCd; uniform float uTime,uCover,uStorm,uFlash,uRainbow; varying vec3 vDir;
${NOISE_GLSL}
vec3 hue(float h){return clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);}
void main(){
  vec3 d=normalize(vDir); float y=max(d.y,0.);
  vec3 col=mix(uHor,uTop,pow(y,.5));
  vec2 uv=d.xz/(d.y+.14)*1.1+vec2(uTime*.025*(1.+uStorm*3.),uTime*.01);
  float n=fbm(uv);
  float c=smoothstep(1.-uCover,1.-uCover+.3,n)*smoothstep(-.02,.15,d.y);
  float sh=fbm(uv*1.8+4.);
  vec3 cc=mix(uCl,uCd,clamp(sh*.9+uStorm*.35-.1,0.,1.));
  col=mix(col,cc,c*.95);
  if(uRainbow>0.){
    vec3 a=normalize(vec3(.1,-.22,-1.)); float ang=acos(dot(d,a)); float r=(ang-.56)/.075;
    if(r>0.&&r<1.) col=mix(col,hue((1.-r)*.78)*1.1+.1,uRainbow*.5*sin(r*3.14159)*smoothstep(0.,.08,d.y)*(1.-c*.7));
  }
  col+=uFlash*vec3(.55,.6,.75)*(.35+c);
  gl_FragColor=vec4(col,1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), skyMat); sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

// distant islands
const islands = new THREE.Group(); scene.add(islands);
{
  const m1 = new THREE.MeshStandardMaterial({ color: '#4f8f5a', flatShading: true, roughness: 1 });
  const m2 = new THREE.MeshStandardMaterial({ color: '#d9c48f', flatShading: true, roughness: 1 });

function parseNames(txt) { return txt.split(/\r?\n|;/).map(s => s.replace(/^\s*\d+[.)\-\s]+/, '').replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 60); }
function shortNames(list) {
  const last = list.map(n => n.split(' ').pop());
  return list.map((n, i) => {
    if (last.filter(x => x === last[i]).length === 1) return last[i];
    const w = n.split(' '); const s = w.length > 1 ? `${w[w.length - 2]} ${last[i]}` : n;
    return list.filter((m, j) => { const ww = m.split(' '); return (ww.length > 1 ? `${ww[ww.length - 2]} ${ww[ww.length - 1]}` : m) === s; }).length > 1 ? n : s;
  });
}

function setStatus(txt, twist = false) { const s = $('status'); s.textContent = txt; s.classList.toggle('twist', twist); if (twist) { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; } }
const deckStudents = () => students.filter(s => s.mode === 'deck');
function candidates(exclude = []) {
  let c = deckStudents().filter(s => !s.immune && !s.cool && !exclude.includes(s));
  if (!c.length) c = deckStudents().filter(s => !s.immune && !exclude.includes(s));
  if (!c.length) c = deckStudents();
  return c;
}
function weighted(list) {
  const w = list.map(s => OPT.fair ? 1 / (1 + 1.6 * (HIST[s.full] || 0)) : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

function startGame(names) {
  for (const s of students) s.dispose();
  students = []; water.length = 0;
  for (const k of ['dolphin', 'tentacle', 'chest', 'bottle']) props[k].visible = false;
  layoutSlots(names.length);
  const sn = shortNames(names);
  students = names.map((n, i) => new Student(n, sn[i], i));
  const order = students.map((s, i) => i).sort(() => Math.random() - .5);
  order.forEach((si, k) => { students[si].slot = SLOTS[k]; });
  // boarding order: back rows first so nobody jumps through someone
  const byDepth = students.slice().sort((a, b) => a.slot.z - b.slot.z || a.slot.x - b.slot.x);
  byDepth.forEach((s, k) => { s.mode = 'wait'; s.delay = k * (REDUCED ? .03 : .075); });
  pier.position.x = 0; pier.visible = true; islands.position.x = 0;
  W.target = 0; W.flow = 0; W.flowV = 0; W.rainbowT = 0;
  camShot = 'board';
  setPhase('board');
  setStatus('Cả lớp lên thuyền nào! 🚢');
  const total = byDepth.length * (REDUCED ? .03 : .075) + 4.4;
  sleep(total).then(() => { if (phase === 'board') { setPhase('ready'); setStatus(`Đủ ${students.length} thủy thủ rồi! Bấm "Ra khơi" để bắt đầu ⛵`); } });
}

async function roulette(cands, target, hops = 20) {
  if (cands.length <= 1) { spot.target = target; spot.on = true; await sleep(.6); return; }
  spot.on = true;
  let prev = null;
  for (let i = 0; i < hops; i++) {
    let s = i === hops - 1 ? target : pick(cands);
    if (s === prev && i < hops - 1) s = pick(cands);
    spot.target = s; prev = s; s.nervous = 1.2; sfx.tick(i);
    const k = i / (hops - 1);
    await sleep(REDUCED ? .05 : .06 + .42 * Math.pow(k, 2.6));
  }
  target.nervous = 2; target.say(pick(['Ơ… em á?!', 'Khônggg!', 'Sao lại là em?!', 'Hả???']), 1.4);
  await sleep(.9);
}
async function fallSequence(target, wi, allowFake) {
  if (allowFake && Math.random() < .22 && candidates([target]).length > 1) {
    sfx.hit(); boatKick(.2); target.scream = 2;
    await target.arcTo(() => _v2.set(target.slot.x, hullTop(target.slot.x) - .95, hullW(target.slot.x) + .28).applyMatrix4(boat.matrixWorld).clone(), .6, 1.0, 0);
    target.mode = 'hang'; target.say('Ối ối ối!!', 1.6);
    setStatus('Khoan đã… bạn ấy bám được mạn thuyền! 😱', true);
    await sleep(1.7);
    sfx.boing(); target.say('Phù… thoát rồi! 😎', 1.6);
    await target.arcTo(() => target.deckWorld().clone(), .6, 1.0, 0); target.mode = 'deck'; target.cool = true;
    setStatus('PLOT TWIST! Con sóng đổi hướng… 🌀', true); sfx.twist();
    const other = weighted(candidates([target]));
    await roulette(candidates([target]), other, 8);
    target = other;
  }
  await knockOff(target, wi);
}
async function knockOff(s, wi) {
  sfx.hit(); sfx.whoosh(); boatKick(.26); s.scream = 3; spot.on = false;
  s.say(pick(['Aaaaaa!', 'Cứu emmm!', 'Ôi không!', 'Á á á!']), 1.4);

  s.mode = 'swim'; s.buoy.scale.setScalar(.01);
  bigSplash(waterPos(wi, _v2).clone().setY(waveH(_v2.x, _v2.z)));
  s.say(pick(['Cứu với!', 'Lạnh quá!', 'Ai cứu em với!', 'Huhu…']), 1.8);

}
async function backToDeck(s, h = 2.6) {
  const wi = s.water; s.water = -1; if (water[wi] === s) water[wi] = null;
  s.buoy.visible = false; s.cool = true;
  await s.arcTo(() => s.deckWorld().clone(), 1.0, h, -1);
  s.mode = 'deck'; s.cheer = 1.5; sfx.pop();
  return wi;
}
function boatKick(a) { W.kick = (W.kick || 0) + a; }

function chooseTwist() {
  const list = TWISTS.filter(t => t.id !== lastTwist);
  let r = Math.random() * list.reduce((a, t) => a + t.w, 0);
  for (const t of list) { r -= t.w; if (r <= 0) return t; }

}

function setTentacle(base, tip, k, wig) {
  const segs = props.tseg, n = segs.length;
  const c1 = base.clone().add(new THREE.Vector3(0, 3.5, 0)), c2 = tip.clone().add(new THREE.Vector3(0, 2.6, .5));
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1) * k;
    const a = 1 - u;
    const p = base.clone().multiplyScalar(a * a * a).add(c1.clone().multiplyScalar(3 * a * a * u)).add(c2.clone().multiplyScalar(3 * a * u * u)).add(tip.clone().multiplyScalar(u * u * u));
    p.x += Math.sin(T * 5 + i * .5) * .12 * wig * u; p.z += Math.cos(T * 4 + i * .4) * .1 * wig * u;
    segs[i].position.copy(p); segs[i].visible = i / (n - 1) <= k + .02;
  }
  return segs[n - 1].position;
}

async function finish() {
  if (busy || phase !== 'fallen') return; busy = true;
  const list = fallenList();
  for (const s of list) HIST[s.full] = (HIST[s.full] || 0) + 1;
  for (const k of Object.keys(HIST)) if (!list.find(s => s.full === k)) HIST[k] = Math.max(0, HIST[k] * .85 - .05);
  store('fateboat.hist', JSON.stringify(HIST));
  W.target = 0; W.rainbowT = 1; camShot = 'final';
  setStatus('Bão tan rồi! 🌈'); setPhase('final');
  for (const s of deckStudents()) { s.cheer = 3 + Math.random(); s.immune = false; s.crown.visible = s.crown.visible && true; }
  await sleep(REDUCED ? .3 : 1.6);
  sfx.fanfare(); confetti();
  const wn = $('winners'); wn.innerHTML = '';
  list.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'win'; d.style.animationDelay = `${i * .25}s`;
    d.innerHTML = `<div class="av" style="background:${s.color}"></div><div class="no">BẠN SỐ ${i + 1}</div><div class="nm"></div>`;
    d.querySelector('.av').textContent = s.short[0]; d.querySelector('.nm').textContent = s.full; wn.appendChild(d);
  });
  $('final').hidden = false;
  setStatus(`Mời ${list.map(s => s.short).join(', ')} lên kiểm tra bài cũ! 📚`);
  busy = false;
}

// ============================================================ UI
function setPhase(p) {
  phase = p;
  const hud = $('hud'); hud.innerHTML = '';
  const btn = (txt, cls, fn, key) => { const b = document.createElement('button'); b.className = 'big ' + cls; b.innerHTML = txt + (key && !TOUCH ? `<span class="kbd">${key}</span>` : ''); b.onclick = fn; hud.appendChild(b); return b; };
  if (p === 'ready') btn('⛵ Ra khơi!', 'primary', setSail, 'Space');
  if (p === 'fallen') { btn('🍾 Chai bí ẩn', 'sea', openBottle, 'B'); btn('✅ Chốt danh sách', 'primary', finish, 'Enter'); }
  if (p === 'final' && $('final').hidden) btn('🔄 Chơi lại', 'primary', replay, 'Space');
  renderFallen();
}
function renderFallen() {
  const box = $('fallen'); box.innerHTML = '';
  if (!['fallen', 'twist'].includes(phase)) return;
  for (const s of fallenList()) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="av" style="background:${s.color}"></div><div><div class="tag">🌊 ĐANG Ở DƯỚI BIỂN</div><div class="nm"></div></div><button>🛟 Cứu</button>`;
    c.querySelector('.av').textContent = s.short[0]; c.querySelector('.nm').textContent = s.full;
    const b = c.querySelector('button'); b.disabled = phase !== 'fallen' || busy; b.onclick = () => rescue(s);
    box.appendChild(c);
  }
}
function replay() {
  $('final').hidden = true;
  const names = students.map(s => s.full);
  startGame(names);
}
const ta = $('names');
ta.value = store('fateboat.names') || '';
const updCount = () => { const n = parseNames(ta.value).length; $('count').textContent = `${n} học sinh`; $('bStart').disabled = n < 4; };
ta.oninput = updCount;
$('bSample').onclick = () => { ta.value = SAMPLE; updCount(); };
$('bClearHist').onclick = () => { HIST = {}; store('fateboat.hist', '{}'); $('bClearHist').textContent = '✔ Đã xoá'; };
try { const o = JSON.parse(store('fateboat.opt') || '{}'); if (o.n) $('nPick').value = o.n; if (o.fake === false) $('oFake').checked = false; if (o.fair === false) $('oFair').checked = false; } catch (e) { }
$('bStart').onclick = () => {
  const names = parseNames(ta.value); if (names.length < 4) return;
  store('fateboat.names', ta.value);
  NPICK = clamp(parseInt($('nPick').value) || 3, 1, Math.min(5, names.length - 2));
  OPT = { fake: $('oFake').checked, fair: $('oFair').checked };
  store('fateboat.opt', JSON.stringify({ n: NPICK, ...OPT }));
  $('setup').hidden = true; $('final').hidden = true;
  startGame(names);
};
$('bSet').onclick = () => { if (busy) return; $('setup').hidden = !$('setup').hidden; updCount(); };
$('bList').onclick = () => { $('final').hidden = true; $('setup').hidden = false; updCount(); };
$('bView').onclick = () => { $('final').hidden = true; setPhase('final'); };
$('bAgain').onclick = replay;
$('bSound').onclick = async () => { const on = await sfx.toggle(); $('bSound').textContent = on ? '🔊' : '🔇'; $('bSound').setAttribute('aria-pressed', on); };
$('bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if (!$('twist').hidden) { $('twist').querySelector('.tc').click(); return; }
    if (phase === 'ready') setSail();
    else if (phase === 'fallen' && k === 'enter') finish();
    else if (phase === 'fallen') openBottle();
    else if (phase === 'final') replay();
  }
  if (k === 'b') openBottle();
  if (k === 'm') $('bSound').click();
  if (k === 'f') $('bFull').click();
  if (phase === 'fallen' && /^[1-5]$/.test(k)) { const s = water[+k - 1]; if (s) rescue(s); }
});
updCount();

// confetti (2D overlay)
const fx = $('fx'), fxc = fx.getContext('2d'); let conf = [];
function confetti() {
  if (REDUCED) return;
  const cols = ['#ffd23f', '#ff5e7e', '#3fc1ff', '#7bed9f', '#ffffff', '#ff9f43'];
  for (let i = 0; i < 260; i++) conf.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: rnd(-60, 60), vy: rnd(120, 260), r: rnd(0, TAU), vr: rnd(-8, 8), w: rnd(7, 13), h: rnd(4, 8), c: pick(cols), life: rnd(4, 7) });
}

// ============================================================ camera
let camShot = 'board';
const SHOTS = {
  board: { p: [-4, 6.2, 18], l: [-3.4, 1.8, 0] },
  sail: { p: [1, 6.4, 19], l: [0, 2.6, 0] },
  deck: { p: [0, 6.3, 15.8], l: [-.3, 1.9, .4] },
  water: { p: [0, 5.6, 17], l: [-.3, 1.5, 1.8] },
  final: { p: [0, 4.4, 21], l: [0, 4.0, 0] },
};
const camP = new THREE.Vector3(...SHOTS.board.p), camL = new THREE.Vector3(...SHOTS.board.l);
function camUpdate(dt, t) {
  const sh = SHOTS[camShot], asp = camera.aspect;
  const fit = asp < 1.3 ? Math.min(3, 1.3 / asp) : 1;
  const tp = _v.set(...sh.p); const tl = _v2.set(...sh.l);
  tp.sub(tl).multiplyScalar(fit).add(tl);
  if (asp < 1) tp.y += (fit - 1) * 3;
  const k = 1 - Math.exp(-dt * 1.6);
  camP.lerp(tp, k); camL.lerp(tl, k);
  const sw = REDUCED ? 0 : (.06 + W.storm * .2);
  camera.position.copy(camP).add(_v.set(Math.sin(t * .5) * sw, Math.sin(t * .8) * sw * .7, 0));
  camera.lookAt(camL);
}

// ============================================================ resize + labels
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  fx.width = w * Math.min(devicePixelRatio, 2); fx.height = h * Math.min(devicePixelRatio, 2);
}
addEventListener('resize', resize); resize();
function updateLabels() {
  const w = innerWidth, h = innerHeight;
  for (const s of students) {
    const vis = s.group.visible;
    if (!vis) { if (s.el.style.display !== 'none') s.el.style.display = 'none'; if (s.bub) s.bub.style.display = 'none'; continue; }
    s.headG.getWorldPosition(_v); _v.y += s.mode === 'swim' ? .62 : .5;
    _v.project(camera);
    const x = (_v.x * .5 + .5) * w, y = (-_v.y * .5 + .5) * h;
    if (s.el.style.display === 'none') s.el.style.display = '';
    const hot = spot.on && spot.target === s, wet = s.mode === 'swim' || (s.water >= 0);
    const cls = 'lbl' + (hot ? ' hot' : wet ? ' wet' : '') + (s.immune ? ' safe' : '') + (phase === 'final' && s.mode === 'deck' ? ' dim' : '');
    if (s.el.className !== cls) s.el.className = cls;
    if (wet && s.el.textContent !== s.full) s.el.textContent = s.full; else if (!wet && s.el.textContent !== s.short) s.el.textContent = s.short;
    s.el.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
    s.el.style.zIndex = hot ? 30 : wet ? 20 : Math.round(10 + _v.y * -5);
    if (s.bub) {
      if (s.bubT > 0) { s.bub.style.display = ''; s.bub.style.transform = `translate(${x}px,${y - (hot || wet ? 44 : 28)}px) translate(-50%,-100%)`; }
      else s.bub.style.display = 'none';
    }
  }
}

// ============================================================ main loop
const clock = new THREE.Clock();
let lightT = 6;
const RSKIP = +Q.get('rskip') || 0;
const SIM_STEPS = Math.max(1, +Q.get('sim') || 1);
function frame() {
  const dt0 = Math.min(clock.getDelta(), .1);
  if (window.FREEZE) { updateLabels(); renderer.render(scene, camera); setTimeout(frame, 16); return; }
  for (let i = 0; i < SIM_STEPS; i++) simulate(SIM_STEPS > 1 ? .05 : dt0);
  const dt = dt0;
  camUpdate(dt, T);
  if (!RSKIP || (window.__frames || 0) % RSKIP === 0) renderer.render(scene, camera);
  updateLabels();
  confettiStep(dt); window.__frames = (window.__frames || 0) + 1; if (Q.get('auto') && window.__frames % 10 == 0) document.body.dataset.f = window.__frames + ' T=' + T.toFixed(1);
  sfx.update();
  if (Q.get('auto')) setTimeout(frame, 16); else requestAnimationFrame(frame);
}
function simulate(dt) {
  T += dt;
  // weather
  W.storm += (W.target - W.storm) * Math.min(1, dt * .9);
  if (Q.has('storm')) W.storm = W.target;
  const s = W.storm;
  for (let i = 0; i < 5; i++) { AMP[i] = lerp(WAVES[i].a0, WAVES[i].a1, s); oceanMat.uniforms.uA.value[i] = AMP[i]; }
  oceanMat.uniforms.uAmpSum.value = AMP.reduce((a, b) => a + b, 0);
  W.flowV *= Math.exp(-dt * .25); W.flow += W.flowV * dt;
  W.rainbow += (W.rainbowT - W.rainbow) * Math.min(1, dt * .5);
  W.flash = Math.max(0, W.flash - dt * 3.2);
  if (W.boltT > 0) { W.boltT -= dt; boltMat.opacity = clamp(W.boltT * 6, 0, 1); if (W.boltT <= 0 && bolt) bolt.visible = false; }
  if (s > .6 && !REDUCED) { lightT -= dt; if (lightT <= 0) { lightning(); lightT = rnd(4, 9); } }
  const fl = W.flash * (REDUCED ? .2 : 1);
  scene.fog.color.copy(mixC('fog', s)); scene.fog.near = lerp(45, 22, s); scene.fog.far = lerp(190, 115, s);
  renderer.setClearColor(scene.fog.color);
  hemi.color.copy(mixC('hs', s)); hemi.groundColor.copy(mixC('hg', s)); hemi.intensity = lerp(PAL.calm.hemiI, PAL.storm.hemiI, s) + fl * .9;
  sun.intensity = lerp(PAL.calm.sunI, PAL.storm.sunI, s);
  const su = skyMat.uniforms;
  su.uTop.value.copy(mixC('top', s)); su.uHor.value.copy(mixC('hor', s)); su.uCl.value.copy(mixC('cl', s)); su.uCd.value.copy(mixC('cd', s));
  su.uTime.value = T; su.uCover.value = lerp(.32, .92, s); su.uStorm.value = s; su.uFlash.value = fl; su.uRainbow.value = W.rainbow;
  const ou = oceanMat.uniforms;
  ou.uTime.value = T; ou.uFlow.value = W.flow; ou.uDeep.value.copy(mixC('deep', s)); ou.uShal.value.copy(mixC('shal', s)); ou.uSky.value.copy(mixC('hor', s));
  ou.uSunI.value = lerp(1, .15, s); ou.uFlash.value = fl; ou.uStorm.value = s;
  // pier + islands drift away when sailing
  if (pier.userData.leave) { pier.position.x -= dt * 9; islands.position.x -= dt * 2; if (pier.position.x < -50) { pier.visible = false; pier.userData.leave = false; } }
  // boat rides the waves
  const hb = waveH(6, 0), hs = waveH(-6, 0), hp = waveH(0, 2.6), hn = waveH(0, -2.6);
  W.kick = (W.kick || 0) * Math.exp(-dt * 1.8);
  const kickRoll = W.kick * Math.sin(T * 5.5) * .4 + W.kick * .6;
  boat.position.y = lerp(boat.position.y, (hb + hs + hp + hn) / 4 + .38, Math.min(1, dt * 4));
  boat.rotation.z = lerp(boat.rotation.z, Math.atan2(hb - hs, 12) * .9, Math.min(1, dt * 3));
  boat.rotation.x = lerp(boat.rotation.x, Math.atan2(hn - hp, 5.2) * .9 + kickRoll, Math.min(1, dt * 4));
  boat.updateMatrixWorld();
  ou.uBoat.value.set(boat.position.x, boat.position.z, 0);
  animateRig(T);
  // tweens
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
  for (const st of students) { st.update(dt, T); if (st.bubT > 0) st.bubT -= dt; }
  // spotlight

  if (spOn) { spot.target.group.getWorldPosition(_v); spot.pos.lerp(_v, Math.min(1, dt * 22)); }
  const sk = spOn ? 1 : 0;
  spotLight.intensity = lerp(spotLight.intensity, sk * 9, Math.min(1, dt * 10));
  spotLight.position.copy(spot.pos).add(_v.set(0, 9, 0)); spotLight.target.position.copy(spot.pos);
  cone.position.copy(spot.pos).add(_v.set(0, 9, 0)); cone.material.opacity = lerp(cone.material.opacity, sk * .16, Math.min(1, dt * 10));
  spotRing.position.copy(spot.pos).add(_v.set(0, .06, 0)); spotRing.material.opacity = lerp(spotRing.material.opacity, sk * .9, Math.min(1, dt * 10));
  spotRing.scale.setScalar(1 + Math.sin(T * 10) * .08);
  // rain
  rainMat.opacity = clamp((s - .3) * .7, 0, .45);
  if (rainMat.opacity > 0) {
    for (let i = 0; i < RAIN_N; i++) { const r = rainSeed[i]; r[1] -= r[3] * dt; if (r[1] < -1) r[1] += 25; const o = i * 6; rainPos[o] = r[0]; rainPos[o + 1] = r[1]; rainPos[o + 2] = r[2]; rainPos[o + 3] = r[0] + .25; rainPos[o + 4] = r[1] + .9; rainPos[o + 5] = r[2]; }
    rainGeo.attributes.position.needsUpdate = true; rain.visible = true;
  } else rain.visible = false;
  // particles
  for (let i = 0; i < SPL_N; i++) {
    const q = parts[i], o = i * 3;
    if (q.life > 0) { q.life -= dt; q.v.y -= q.g * dt; q.p.addScaledVector(q.v, dt); const a = Math.max(0, q.life / q.max); splPos[o] = q.p.x; splPos[o + 1] = q.p.y; splPos[o + 2] = q.p.z; splCol[o] = q.c.r * a; splCol[o + 1] = q.c.g * a; splCol[o + 2] = q.c.b * a; }
    else { splPos[o + 1] = -100; }
  }
  splGeo.attributes.position.needsUpdate = true; splGeo.attributes.color.needsUpdate = true;
  splMat.blending = THREE.AdditiveBlending;
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; const k = r.t / r.max; if (k >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); continue; } if (k < 0) { r.m.visible = false; continue; } r.m.visible = true; r.m.scale.setScalar(.4 + k * 2.6); r.m.material.opacity = .8 * (1 - k); r.m.position.y = waveH(r.m.position.x, r.m.position.z) + .03; }
}
function confettiStep(dt) {
  if (conf.length) {

      fxc.save(); fxc.translate(c.x, c.y); fxc.rotate(c.r); fxc.scale(1, Math.cos(c.r * 1.7)); fxc.fillStyle = c.c; fxc.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); fxc.restore(); }
    if (!conf.length) fxc.clearRect(0, 0, innerWidth, innerHeight);
  }
}

// ============================================================ boot + test states (?state=ready|storm|fallen|twist|final&ui=0)
function boot() {
  const st = Q.get('state');
  if (st) {
    $('setup').hidden = true;
    const names = parseNames(SAMPLE); NPICK = 3; startGame(names);
    if (st !== 'board') { instantBoard(); pier.visible = false; }
    if (st !== 'ready' && st !== 'board') { W.target = W.storm = 1; camShot = 'deck'; setStatus('Con sóng thứ 2 đang tới… ai sẽ rơi xuống biển? 🌊'); }
    if (st === 'storm') { const tg = students[7]; spot.on = true; spot.target = tg; tg.group.position.set(0, 0, 0); spot.pos.copy(tg.deckWorld()); tg.nervous = 99; setPhase('sail'); }
    if (['fallen', 'twist', 'final'].includes(st)) {
      [3, 18, 30].forEach((idx, i) => { const s = students[idx]; s.mode = 'swim'; s.water = i; water[i] = s; s.buoy.scale.setScalar(1); waterPos(i, s.group.position); });
      W.target = W.storm = .78; camShot = 'water'; setPhase('fallen'); setStatus('3 bạn rơi xuống biển! Cứu ai không? Hay mở chai bí ẩn? 🍾');
      students[3].say('Cứu với!', 99);
    }
    if (st === 'twist') showCard('🐙', 'Bạch tuộc tinh nghịch!', 'Một xúc tu khổng lồ trồi lên… nó muốn đổi chỗ ai đó!', 99);
    if (st === 'final') { W.target = W.storm = 0; W.rainbow = W.rainbowT = 1; camShot = 'final'; phase = 'fallen'; finish(); }
    if (Q.get('cam')) { const c = Q.get('cam').split(',').map(Number); SHOTS.dbg = { p: c.slice(0, 3), l: c.slice(3, 6) }; camShot = 'dbg'; }
    const sh = SHOTS[camShot]; camP.set(...sh.p); camL.set(...sh.l);
    if (camera.aspect < 1.3) { const f = Math.min(3, 1.3 / camera.aspect); camP.sub(camL).multiplyScalar(f).add(camL); if (camera.aspect < 1) camP.y += (f - 1) * 3; }
  }
  if (Q.get('ui') === '0') for (const id of ['top', 'hud', 'fallen', 'corner']) $(id).hidden = true;

}
if (Q.get('auto')) (async () => {
  const pre = document.createElement('pre'); pre.id = 'autolog'; pre.style.cssText = 'position:fixed;left:8px;top:120px;z-index:50;background:#000a;color:#0f0;font-size:11px;max-width:60vw;white-space:pre-wrap'; document.body.appendChild(pre);
  const log = m => { document.title = m; pre.textContent += m + String.fromCharCode(10); };
  addEventListener('error', e => log('ERR ' + e.message + ' @' + e.lineno)); addEventListener('unhandledrejection', e => log('REJ ' + (e.reason && e.reason.stack)));
  $('setup').hidden = true; NPICK = 3; startGame(parseNames(SAMPLE));
  log('start'); await sleep(9); log('boarded ' + deckStudents().length);
  if (Q.get('shot') === 'fall') { setSail(); await sleep(+Q.get('at') || 8); window.FREEZE = true; return; }
  await setSail(); log('fallen ' + fallenList().map(s => s.short));
  const SHOT = Q.get('shot'), AT = +Q.get('at') || 2;
  if (SHOT) { $('autolog').hidden = true; for (const id of ['twist']) $(id).style.display = 'none'; }
  if (SHOT === 'final') { await finish(); await sleep(AT); window.FREEZE = true; return; }
  for (const tw of TWISTS) { if (SHOT === tw.id) { busy = true; setPhase('twist'); tw.fn(tw); await sleep(AT); window.FREEZE = true; return; } }
  for (const tw of TWISTS) { busy = true; setPhase('twist'); await tw.fn(tw); endTwist(); log(tw.id + ' -> ' + fallenList().map(s => s.short) + ' deck=' + deckStudents().length); }
  await openBottle(); log('bottle ok');
  await rescue(water[1]); log('rescue -> ' + fallenList().map(s => s.short));
  await finish(); log('AUTO-DONE ' + fallenList().length + ' fallen, deck=' + deckStudents().length + ', final=' + !$('final').hidden);
})().catch(e => { document.title = 'AUTO-ERR ' + e.message; $('autolog') && ($('autolog').textContent += 'ERR ' + e.stack); });
window.GAME = { get students() { return students; }, W, setSail, openBottle, finish, rescue };
boot();
